[pytest]
asyncio_mode = auto
addopts = -m "not postgres and not live_service and not real_llm"
# The async SQLAlchemy integration tests create and dispose engines within their
# own event-loop lifecycle, so the default test run is intentionally serial.
markers =
    real_llm: opt-in tests that call the configured real LLM provider
    postgres: opt-in tests requiring a dedicated PostgreSQL test database
    live_service: tests requiring an already-running backend or external service
    integration: multi-component tests requiring isolated integration infrastructure
